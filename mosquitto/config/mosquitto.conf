persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log

# Authentifizierung (Passwortdatei wird beim Start aus .env erzeugt)
allow_anonymous false
password_file /mosquitto/data/passwd

# MQTT
listener 1883
protocol mqtt

# MQTT über WebSockets
listener 9001
protocol websockets
